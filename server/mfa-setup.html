<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Up Two-Step Login · Funded Sky</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#08080A;color:#F4F2F1;font:15px/1.5 "Mona Sans",system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 20px}
  .card{width:100%;max-width:480px;background:#18181A;border:1px solid #26262A;border-radius:12px;padding:32px}
  h1{margin:0 0 8px;font-size:26px;line-height:32px;letter-spacing:-.02em;font-weight:600}
  p{margin:0 0 16px;color:#D4CFCD}
  .mu{color:#9C9693;font-size:13px}
  .steps{margin:0 0 20px;padding-left:20px;color:#D4CFCD}
  .steps li{margin-bottom:6px}
  .qr{width:200px;height:200px;margin:4px auto 14px;background:white;border-radius:8px;padding:8px}
  .qr svg{width:100%;height:100%;display:block}
  .key{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;background:#111113;border:1px solid #26262A;border-radius:6px;padding:10px 12px;text-align:center;letter-spacing:.04em;margin-bottom:20px;word-spacing:.2em}
  .key span{white-space:nowrap}
  label{display:block;font-size:13px;color:#9C9693;margin-bottom:6px}
  input{width:100%;height:48px;background:#111113;border:1px solid #26262A;border-radius:4px;padding:0 14px;color:#F4F2F1;font:600 20px ui-monospace,Menlo,monospace;letter-spacing:.3em;text-align:center}
  input:focus{outline:2px solid #7CC4FF;outline-offset:1px}
  button{width:100%;height:48px;margin-top:14px;background:#fff;color:#111113;border:0;border-radius:4px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 4px}
  .row button{margin-top:0;background:#111113;color:#F4F2F1;border:1px solid #26262A}
  .err{color:#F2777F;font-size:13px;margin-top:8px;min-height:18px}
  .codes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
  .codes span{font:500 14px ui-monospace,Menlo,monospace;background:#111113;border:1px solid #26262A;border-radius:6px;padding:8px;text-align:center}
  a{color:#7CC4FF}
  .foot{margin-top:18px;text-align:center;font-size:13px;color:#9C9693}
</style>
</head>
<body>
<main class="card" id="app" aria-live="polite"><p class="mu">Loading…</p></main>
<script>
(function () {
  var app = document.getElementById('app');
  var next = new URLSearchParams(location.search).get('next') || '/admin';
  if (!/^\/admin/.test(next)) next = '/admin';
  function api(path, body) {
    return fetch(path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; }); });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  api('/api/auth/mfa/setup').then(function (s) {
    app.innerHTML = '<h1>Set Up Two-Step Login</h1><p>The back office shows trader details, so every staff account needs a code from your phone as well as a password.</p>' +
      '<ol class="steps"><li>Open an authenticator app on your phone, such as Google Authenticator, 1Password or Authy.</li><li>Scan this code, or type the key below.</li><li>Enter the six-digit code the app shows.</li></ol>' +
      '<div class="qr" aria-label="QR code for your authenticator app">' + s.qr + '</div>' +
      '<div class="key" aria-label="Setup key">' + esc(s.secret).split(' ').map(function (g) { return '<span>' + g + '</span>'; }).join(' ') + '</div>' +
      '<label for="code">Code From Your App</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">' +
      '<div class="err" id="err" role="alert"></div><button id="go">Turn On Two-Step Login</button>' +
      '<div class="foot"><a href="/logout">Log Out</a></div>';
    var inp = document.getElementById('code'), btn = document.getElementById('go'), err = document.getElementById('err');
    inp.focus();
    function submit() {
      var code = inp.value.replace(/\D/g, ''); if (code.length !== 6) { err.textContent = 'Enter the six-digit code from your app.'; return; }
      btn.disabled = true; err.textContent = '';
      api('/api/auth/mfa/enable', { code: code }).then(function (r) {
        app.innerHTML = '<h1>Save Your Backup Codes</h1><p>If you lose your phone, each of these codes lets you in once. Keep them somewhere safe, like a password manager. You will not see them again.</p>' +
          '<div class="codes">' + r.codes.map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('') + '</div>' +
          '<div class="row"><button id="copy" type="button">Copy Codes</button><button id="dl" type="button">Download Codes</button></div>' +
          '<button id="done">I Saved My Codes</button>';
        var txt = 'Funded Sky backup codes. Each one works once.\n\n' + r.codes.join('\n') + '\n';
        document.getElementById('copy').onclick = function () { var b = this; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { b.textContent = 'Copied'; }, function () { b.textContent = 'Copy Failed'; }); };
        document.getElementById('dl').onclick = function () { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' })); a.download = 'funded-sky-backup-codes.txt'; document.body.appendChild(a); a.click(); a.remove(); };
        document.getElementById('done').onclick = function () { location.href = next; };
      }).catch(function (e) { btn.disabled = false; err.textContent = e.message; inp.select(); });
    }
    btn.onclick = submit; inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  }).catch(function (e) {
    // Two-step login is already on, but this session was started without a code: the only way in is a fresh sign-in with the code
    if (/already on/i.test(e.message)) { app.innerHTML = '<h1>Two-Step Login</h1><p>Two-step login is already on for your account. To open the Back Office, log in again with your password and the code from your app.</p><button id="again">Log In Again</button>'; document.getElementById('again').onclick = function () { location.href = '/logout?next=' + encodeURIComponent('/login?next=' + encodeURIComponent(next)); }; return; }
    app.innerHTML = '<h1>Two-Step Login</h1><p>' + esc(e.message) + '</p><div class="foot"><a href="/admin">Go to the Back Office</a> · <a href="/logout">Log Out</a></div>'; });
})();
</script>
</body>
</html>
