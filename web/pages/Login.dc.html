<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Funded Sky: log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100..125,400..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#08080A}
a{color:#7CC4FF}a:hover{color:#A9D8FF}
.fs-in{border:1px solid #26262A;outline:none;transition:border-color .15s,box-shadow .15s}
.fs-in:hover{border-color:#3A3A40}
.fs-in:focus{border-color:#7CC4FF;box-shadow:0 0 0 3px rgba(124,196,255,.18)}
.fs-ghost{transition:border-color .15s}
.fs-ghost:hover{border-color:#3A3A40}
.fs-check{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;flex:none;border:1.5px solid #3A3A40;border-radius:5px;background:#08080A;display:inline-grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s}
.fs-check::before{content:"";width:11px;height:11px;background:#08080A;clip-path:polygon(12% 50%,0 63%,40% 100%,100% 22%,87% 10%,40% 74%);transform:scale(0);transition:transform .12s}
.fs-check:hover{border-color:#7CC4FF}
.fs-check:checked{background:#7CC4FF;border-color:#7CC4FF}
.fs-check:checked::before{transform:scale(1)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #7CC4FF;outline-offset:2px}
@media (max-width: 760px){
.fs-hdr{padding:0 20px!important;height:64px;box-sizing:border-box}
.fs-hide-m{display:none!important}
.fs-main{padding:32px 20px 40px!important;align-items:stretch!important}
.fs-card{background:transparent!important;border:0!important;padding:0!important;max-width:none!important}
.fs-h1{font-size:28px!important;line-height:32px!important}
.fs-in{font-size:16px!important}
}
</style>
</helmet>
<div style="min-height: 900px; background: #08080A; color: #F4F2F1; font-family: 'Mona Sans', system-ui, sans-serif; display: flex; flex-direction: column;">

<header style="border-bottom: 1px solid #26262A;">
<div class="fs-hdr" style="max-width: 1200px; margin: 0 auto; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
<a href="/" style="display: flex; align-items: center; gap: 6px; text-decoration: none;"><span style="font-weight: 700; font-size: 22px; letter-spacing: -0.045em; color: #F4F2F1; line-height: 1;">fundedsky</span><span style="background: #7CC4FF; color: #08080A; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; padding: 2px 6px 3px; border-radius: 4px; line-height: 1;">futures</span></a>
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #9C9693;"><span class="fs-hide-m">New to Funded Sky?</span><a href="{{ signupHref }}" style="min-height: 44px; display: flex; align-items: center; font-weight: 500;">Sign Up</a></span>
</div>
</header>

<main class="fs-main" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 32px; box-sizing: border-box;">
<div class="fs-card" style="width: 100%; max-width: 440px; background: #18181A; border: 1px solid #26262A; border-radius: 12px; padding: 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">

<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 class="fs-h1" style="margin: 0; font-size: 32px; line-height: 36px; font-weight: 600; letter-spacing: -0.03em;">Welcome Back.</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #D4CFCD;">Log in to your trader dashboard.</p>
</div>

<sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; gap: 12px; align-items: center; background: #13202E; border: 1px solid #7CC4FF; border-radius: 8px; padding: 16px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7CC4FF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg><span style="font-size: 14px; line-height: 20px; color: #F4F2F1;">Logged in. Taking you to your dashboard…</span></div>
</sc-if>

<sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 10px;">
<button type="button" class="fs-ghost" style="height: 48px; background: #111113; border: 1px solid #26262A; border-radius: 4px; color: #F4F2F1; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;">Continue with Google</button>
<button type="button" class="fs-ghost" style="height: 48px; background: #111113; border: 1px solid #26262A; border-radius: 4px; color: #F4F2F1; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;">Continue with Apple</button>
</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #9C9693;"><span style="flex: 1; height: 1px; background: #26262A;"></span>or<span style="flex: 1; height: 1px; background: #26262A;"></span></div>

<form style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="email" style="font-size: 13px; color: #9C9693;">Email</label>
<input id="email" class="fs-in" type="email" autocomplete="email" placeholder="you@example.com" value="{{ email }}" onChange="{{ setEmail }}" aria-invalid="{{ emailBad }}" aria-describedby="email-err" style="height: 48px; box-sizing: border-box; background: #111113; border-radius: 4px; padding: 0 14px; color: #F4F2F1; font: inherit; font-size: 15px; border-color: {{ emailBd }};">
<sc-if value="{{ emailBad }}" hint-placeholder-val="{{ false }}"><span id="email-err" style="font-size: 13px; color: #F2777F;">Enter a valid email address.</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><label for="pw" style="font-size: 13px; color: #9C9693;">Password</label><a href="{{ forgotHref }}" style="font-size: 13px;">Forgot Password?</a></div>
<div style="position: relative;">
<input id="pw" class="fs-in" type="{{ pwType }}" autocomplete="current-password" value="{{ pw }}" onChange="{{ setPw }}" aria-invalid="{{ pwBad }}" aria-describedby="pw-err" style="width: 100%; height: 48px; box-sizing: border-box; background: #111113; border-radius: 4px; padding: 0 64px 0 14px; color: #F4F2F1; font: inherit; font-size: 15px; border-color: {{ pwBd }};">
<button type="button" onClick="{{ toggleShow }}" aria-label="{{ showLabel }}" style="position: absolute; right: 4px; top: 4px; height: 40px; padding: 0 12px; background: transparent; border: 0; color: #9C9693; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">{{ showText }}</button>
</div>
<sc-if value="{{ pwBad }}" hint-placeholder-val="{{ false }}"><span id="pw-err" style="font-size: 13px; color: #F2777F;">{{ pwErr }}</span></sc-if>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #D4CFCD; cursor: pointer; min-height: 32px;"><input type="checkbox" class="fs-check" checked="{{ remember }}" onChange="{{ toggleRemember }}">Keep Me Logged In</label>
<button type="button" onClick="{{ submit }}" style="height: 48px; background: #FFFFFF; color: #111113; border: 0; border-radius: 4px; font: inherit; font-size: 15px; font-weight: 600; font-stretch: 112%; cursor: pointer;">Log In</button>
</form>
</div>
</sc-if>

<p style="margin: 0; font-size: 14px; color: #9C9693; text-align: center;">Don't have an account? <a href="{{ signupHref }}" style="font-weight: 500;">Sign Up</a></p>
</div>
<p style="margin: 24px 0 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9C9693;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Secure Login · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mobileLinks":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { email: '', pw: '', show: false, remember: true, submitted: false, done: false, busy: false, err: '' }; }
  async submit() {
    const st = this.state; this.setState({ submitted: true, err: '' });
    if (!/.+@.+\..+/.test(st.email) || !st.pw) return;
    this.setState({ busy: true });
    try { const r = await DC.api('/api/auth/login', { email: st.email.trim(), password: st.pw }); this.setState({ done: true }); const n = DC.qs('next'); location.href = n && n.startsWith('/') && !n.startsWith('//') ? n : (r.role && r.role !== 'trader' && DC.qs('admin') ? '/admin' : '/app'); }
    catch (e) { this.setState({ busy: false, err: e.message }); }
  }
  componentDidMount() { this.root = document.getElementById('dc-root'); this.root.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') this.submit(); }); }
  renderVals() {
    const st = this.state;
    const emailOk = /.+@.+\..+/.test(st.email); const pwOk = st.pw.length > 0;
    const emailBad = st.submitted && !emailOk; const pwBad = (st.submitted && !pwOk) || !!st.err;
    return {
      email: st.email, pw: st.pw, remember: st.remember, done: st.done, notDone: !st.done,
      setEmail: (e) => this.setState({ email: e.target.value, err: '' }), setPw: (e) => this.setState({ pw: e.target.value, err: '' }),
      toggleShow: () => this.setState({ show: !st.show }), toggleRemember: () => this.setState({ remember: !st.remember }),
      pwType: st.show ? 'text' : 'password', showText: st.show ? 'Hide' : 'Show', showLabel: st.show ? 'Hide password' : 'Show password',
      emailBad, pwBad, emailBd: emailBad ? '#F2777F' : '', pwBd: pwBad ? '#F2777F' : '', pwErr: st.err || 'Enter your password.',
      submit: () => this.submit(),
      signupHref: '/signup' + (DC.qs('next') ? '?next=' + encodeURIComponent(DC.qs('next')) : ''), forgotHref: '/forgot-password'
    };
  }
}
</script>
</body>
</html>
